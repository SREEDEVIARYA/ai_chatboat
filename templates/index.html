<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Voice Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="robot-icon">
            🤖
        </div>

        <h1>AI Voice Chatbot</h1>

        <p>
            Speak to the AI and get a voice response
        </p>

    </div>


    <!-- Chat Area -->

    <div id="chatBox" class="chat-box">

        <div class="bot-message message">

            <div class="message-label">
                🤖 AI Assistant
            </div>

            <p>
                Hello! Click the microphone and ask me something.
            </p>

        </div>

    </div>


    <!-- Voice Control -->

    <div class="voice-section">

        <button
            id="micButton"
            class="mic-button"
            onclick="startListening()">

            🎤

        </button>

        <p id="voiceStatus">
            Click the microphone to speak
        </p>

    </div>


    <!-- Recognized Text -->

    <div class="recognized-section">

        <label>
            Your voice:
        </label>

        <div id="recognizedText">
            Your speech will appear here...
        </div>

    </div>


    <!-- Loading -->

    <div id="loading"
         class="loading"
         style="display:none;">

        🤔 AI is thinking...

    </div>

</div>


<script src="{{ url_for('static',
filename='js/script.js') }}"></script>

</body>

</html>
